name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check src app scripts tests
      - run: python -m ruff format --check src app scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.validate_demos --output-dir reports/local
